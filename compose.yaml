services:
  backend:
    image: ghcr.io/freeuni-oop/gitbounty-backend:main
    container_name: gitbounty-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - gitbounty-repositories:/app/repositories
    env_file:
      - .env
    develop:
      watch:
        - path: Backend/src
          action: rebuild
    networks:
      - gitbounty-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
