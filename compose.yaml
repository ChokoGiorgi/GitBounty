  keycloak-db:
    image: postgres:15
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
        - gitbounty-network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: gitbounty-keycloak
    env_file:
      - .env
#    build:
#      context: .
#      dockerfile: ./keycloak/Dockerfile
    environment:
        KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
        JAVA_OPTS_APPEND: -Xms256m -Xmx512m
        KC_DB: postgres
        KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
        KC_DB_USERNAME: keycloak
        KC_DB_PASSWORD: password
        KC_FEATURES: hostname:v2
        KC_HOSTNAME_BACKCHANNEL_DYNAMIC: true
        KEYCLOAK_ADMIN: admin
        KEYCLOAK_ADMIN_PASSWORD: admin
    command: start --optimized --hostname=${KEYCLOAK_HOSTNAME}
    depends_on:
      - keycloak-db
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
    networks:
      - gitbounty-network

  frontend:
    image: ghcr.io/freeuni-oop/gitbounty-frontend:main

  caddy:
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - gitbounty-network


volumes:
  mysql-data:
  gitbounty-repositories:
  keycloak_db_data:
  caddy_config:
  caddy_data:

networks:
  gitbounty-network: